name: UMI CI
on:
  pull_request:
  push:
    branches: [codex/qualcomm-sm8250, 'pr/qualcomm-*']

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Repository checks (cross-platform matrix) ────────────────────────
  repository:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: macos-15
            python-version: '3.14'
          - os: windows-2025
            python-version: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    name: Repository (${{ matrix.os }}, Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Device Tree Compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y device-tree-compiler
      - name: Boot tooling tests
        run: python -B -m unittest discover -v -s make-fnnas/qualcomm/sm8250/boot/abl-android-v2/tests
      - name: Rootfs DTB tests
        if: runner.os == 'Linux'
        run: python -B -m unittest discover -v -s tools/legacy/rootfs-build/tests

  # ── Linux-only checks (shell lint + DTC + bash tests) ─────────────────
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y device-tree-compiler
      - run: bash tools/ci-check.sh

  base-image-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install image audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-guestfs linux-image-virtual btrfs-progs
      - name: Audit generated ext4 and Btrfs images
        run: |
          sudo env LIBGUESTFS_BACKEND=direct LIBGUESTFS_BACKEND_SETTINGS=force_tcg \
            FNOS_PYTHON=/usr/bin/python3 /usr/bin/python3 -B -m unittest discover -v -s make-fnnas/qualcomm/sm8250/scripts/tests
