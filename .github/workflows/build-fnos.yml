name: Prepare official fnOS base
on:
  push:
    branches: [codex/qualcomm-sm8250, 'pr/qualcomm-*']
    paths:
      - '.github/workflows/build-fnos.yml'
      - '.github/actions/prepare-fnos-base/**'
      - 'make-fnnas/qualcomm/sm8250/sources/fnos-upstream.lock'
      - 'make-fnnas/qualcomm/sm8250/scripts/base_image.py'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the pinned public upstream base
        run: ./renas -b xiaomi-umi download "$RUNNER_TEMP/fnos.img.xz"
      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-guestfs linux-image-virtual btrfs-progs
          sudo chmod a+r /boot/vmlinuz-*
      - name: Audit the verified base
        uses: ./.github/actions/prepare-fnos-base
        with:
          image: ${{ runner.temp }}/fnos.img.xz
          sha256: locked
          output: out/base-image-report
      - name: Save audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fnos-base-image-report
          path: out/base-image-report/
          if-no-files-found: error
      - name: Extract RootFS into runner storage
        if: runner.os == 'Linux'
        env:
          FNOS_PYTHON: /usr/bin/python3
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_BACKEND_SETTINGS: force_tcg
        run: ./renas -b xiaomi-umi extract "$RUNNER_TEMP/fnos.img.xz" "$RUNNER_TEMP/rootfs.tar" --sha256 locked
