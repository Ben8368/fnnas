name: Publish verified Umi kernel
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Umi kernel run tested on the device
        required: true
        type: string
      run_attempt:
        description: Tested run attempt
        required: true
        type: string
        default: '1'
      profile:
        description: CSOT profile verified on the device
        type: choice
        options: [release, csot-60, csot-90]
        default: release

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-umi-kernel
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish tested kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          PROFILE: ${{ inputs.profile }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          run_path="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          gh api "$run_path/attempts/$RUN_ATTEMPT" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
              (.path | split("@")[0]) == ".github/workflows/build-kernel.yml"
              and .head_repository.full_name == $repo and .head_branch == $branch
              and .conclusion == "success"
            ' > /dev/null
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "umi-$PROFILE-$RUN_ID-$RUN_ATTEMPT" --dir "$RUNNER_TEMP/verified"
          rate=60
          if [[ $PROFILE == csot-90 ]]; then rate=90; fi
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/verified/*-qualcomm-sm8250-xiaomi-umi-csot"${rate}".tar.gz)
          [[ ${#packages[@]} == 1 && ${packages[0]##*/} =~ ^6\.18\.(0|[1-9][0-9]*)-qualcomm-sm8250-xiaomi-umi-csot(60|90)\.tar\.gz$ ]]
          if ! gh release view kernel_fnnas --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release create kernel_fnnas --repo "$GITHUB_REPOSITORY" --target "$DEFAULT_BRANCH" \
              --title "FnNAS kernels" --notes "Published FnNAS and Xiaomi Umi kernels." --latest=false ||
              gh release view kernel_fnnas --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release view kernel_fnnas --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease |
            jq -e '.isDraft == false and .isPrerelease == false' > /dev/null
          gh release upload kernel_fnnas "${packages[0]}" --repo "$GITHUB_REPOSITORY"
