name: Build Umi kernel
on:
  push:
    branches: [codex/qualcomm-sm8250, 'pr/qualcomm-*']
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'make-fnnas/qualcomm/sm8250/kernel/**'
      - 'make-fnnas/qualcomm/sm8250/sources/**'
      - 'make-fnnas/qualcomm/sm8250/scripts/build-kernel.sh'
      - 'make-fnnas/qualcomm/sm8250/scripts/kernel-release.py'
      - 'make-fnnas/qualcomm/sm8250/scripts/rekernel.sh'
      - 'make-fnnas/boards/xiaomi-umi.yml'
      - 'make-fnnas/fnnas-files/different-files/xiaomi-umi/**'
      - 'make-fnnas/fnnas-files/platform-files/qualcomm/**'
      - 'rekernel'
      - 'rekernel-umi'
      - 'tools/ci-build.sh'

permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}-${{ github.sha }}-${{ vars.UMI_KERNEL_PROFILE || 'csot-90' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PROFILE: ${{ vars.UMI_KERNEL_PROFILE || 'csot-90' }}
      WITH_DEBIAN_BASELINE: 'false'
      UMI_KERNEL_VERSION: 'auto'
      PACKAGE_UMI_KERNEL: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable x86-64 runner
        run: |
          # Only on this GitHub-hosted VM: the Android SDK and .NET are not build inputs.
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/.ghcup
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            build-essential git bc bison flex libssl-dev libelf-dev dwarves device-tree-compiler \
            mkbootimg cpio initramfs-tools-core kmod pigz qemu-user-static e2fsprogs dpkg-dev zstd rsync
          df -h "$RUNNER_TEMP"
          test "$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')" -ge 25
      - name: Build and verify selected kernel profile
        run: bash tools/ci-build.sh "$PROFILE" "$RUNNER_TEMP/umi"
      - name: Prepare native fnOS acceptance handoff
        if: ${{ !startsWith(env.PROFILE, 'lab-') }}
        run: |
          evidence="$RUNNER_TEMP/umi/evidence"
          packages=("$evidence/"*-qualcomm-sm8250-xiaomi-umi-csot*.tar.gz)
          [[ ${#packages[@]} == 1 && -f ${packages[0]} ]]
          digest=$(sha256sum < "${packages[0]}")
          digest=${digest%% *}
          printf '%s\t%s\t%s\t%s\t%s\n' \
            "$GITHUB_SHA" "$PROFILE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$digest" \
            > "$evidence/fnos-acceptance.tsv"
          {
            echo '### Native fnOS acceptance'
            echo
            echo 'On the Linux builder, copy this command into the checkout:'
            echo
            echo '```bash'
            printf '%s %s %s %s %s %s %s\n' "printf '%s\t%s\t%s\t%s\t%s\n'" \
              "$GITHUB_SHA" "$PROFILE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$digest" \
              '| ./renas -b xiaomi-umi native-acceptance /dev/stdin'
            echo '```'
            echo
            printf 'The same record is in `fnos-acceptance.tsv` in `%s`.\n' \
              "umi-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep kernel outputs and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umi-${{ env.PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/umi/evidence/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
