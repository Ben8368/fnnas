# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B wired battery charger

maintainers:
  - Ben <Ben8368@vip.qq.com>

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: qcom,pm8150b-charger
  reg:
    maxItems: 1
  interrupts:
    maxItems: 4
  interrupt-names:
    items:
      - const: usbin-plugin
      - const: bat-ov
      - const: wdog-bark
      - const: usbin-icl-change
  io-channels:
    minItems: 3
    maxItems: 8
  io-channel-names:
    minItems: 3
    items:
      - const: usb_in_i_uv
      - const: usb_in_v_div_16
      - const: mid_chg_div6
      - const: cam_therm1
      - const: conn_therm
      - const: quiet_therm
      - const: wireless_therm
      - const: xo_therm
  monitored-battery: true
  power-supplies:
    maxItems: 1
    description: Type-C TCPM input contract provider for wired charging.
  '#thermal-sensor-cells':
    const: 0
  '#cooling-cells':
    const: 2
  qcom,fuel-gauge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Telemetry provider, not a source supplying power to this charger.
  pinctrl-names:
    const: rx-pump-off
  wireless-q1-gpios:
    description: Wireless DC charge path Q1 gate.
    maxItems: 1
  wireless-switch-gpios:
    description: Shared input protection switch enable.
    maxItems: 1
  wireless-pass-gpios:
    description: Shared input pass mode for OTG, unused in sink-only operation.
    maxItems: 1
  wireless-hw-sleep-gpios:
    description: Board RX hardware sleep control, separate from receiver enable.
    maxItems: 1
  wireless-pump-gpios:
    description: Wireless charge pump path request; not the pump IC switching enable.
    maxItems: 1
  qcom,wireless-pump-monitor:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Charge pump whose disabled state must be verified for wireless buck operation.
  qcom,wireless-divider:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Forward voltage divider between the wireless receiver and USBIN.
  qcom,wireless-rx:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Wireless receiver sharing USBIN with the wired Type-C input.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery
  - power-supplies
  - qcom,fuel-gauge
  - '#thermal-sensor-cells'
  - '#cooling-cells'

additionalProperties: false
